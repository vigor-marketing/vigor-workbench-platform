# CVM ins-59qdrwy7（ap-shanghai）实际 Nginx 配置，入口 http://1.15.91.150/。
# 内测隔离入口：/apps/{product-encoder,sales-commission,knowledge-base} 经 auth_request
# 校验工作台会话；无会话时由 BFF 在 DEMO_MODE=true 下以 X-Demo-Role 回退放行。
# 生产必须设 DEMO_MODE=false，届时 X-Demo-Role 回退自动失效。
server {
    # Workbench shell routes must always resolve to the shell on refresh.
    location = /workspace { return 302 /; }
    location ^~ /workspace/ {
        rewrite ^ / break;
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal BFF subrequests enforce the workbench session and the app role grant.
    location = /__workbench_access/product-encoder { internal; proxy_pass http://127.0.0.1:4000/api/internal/app-access/product-encoder; proxy_pass_request_body off; proxy_set_header Content-Length ""; proxy_set_header Cookie $http_cookie; proxy_set_header X-Demo-Role $http_x_demo_role; }
    location = /__workbench_access/sales-commission { internal; proxy_pass http://127.0.0.1:4000/api/internal/app-access/sales-commission; proxy_pass_request_body off; proxy_set_header Content-Length ""; proxy_set_header Cookie $http_cookie; proxy_set_header X-Demo-Role $http_x_demo_role; }
    location = /__workbench_access/knowledge-base { internal; proxy_pass http://127.0.0.1:4000/api/internal/app-access/knowledge-base; proxy_pass_request_body off; proxy_set_header Content-Length ""; proxy_set_header Cookie $http_cookie; proxy_set_header X-Demo-Role $http_x_demo_role; }

    location = /__workbench_context/knowledge-base { internal; proxy_pass http://127.0.0.1:4000/api/internal/app-context/knowledge-base; proxy_pass_request_body off; proxy_set_header Content-Length ""; proxy_set_header Cookie $http_cookie; proxy_set_header X-Demo-Role $http_x_demo_role; }

    # Platform BFF is private; only this same-origin path is exposed.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
    server_name 1.15.91.150;
    client_max_body_size 50m;
    location ^~ /apps/ai-sales-coach/api/ { rewrite ^/apps/ai-sales-coach(/api/.*)$ $1 break; proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location ^~ /apps/ai-sales-coach/uploads/ { rewrite ^/apps/ai-sales-coach(/uploads/.*)$ $1 break; proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /apps/ai-sales-coach/ { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location ^~ /apps/sales-commission/api/ { auth_request /__workbench_access/sales-commission; rewrite ^/apps/sales-commission(/api/.*)$ $1 break; proxy_pass http://127.0.0.1:18081; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /apps/sales-commission/ { auth_request /__workbench_access/sales-commission; proxy_pass http://127.0.0.1:18081/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /apps/product-encoder/ { auth_request /__workbench_access/product-encoder; charset utf-8; proxy_pass http://127.0.0.1:18080/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location ^~ /apps/knowledge-base/api/ { auth_request /__workbench_context/knowledge-base; auth_request_set $knowledge_admin $upstream_http_x_workbench_admin; proxy_set_header X-Workbench-Admin $knowledge_admin; rewrite ^/apps/knowledge-base(/api/.*)$ $1 break; proxy_pass http://127.0.0.1:4180; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /apps/knowledge-base/ { auth_request /__workbench_access/knowledge-base; proxy_pass http://127.0.0.1:4180; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { proxy_pass http://127.0.0.1:8088; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}
