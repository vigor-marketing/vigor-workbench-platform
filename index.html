  <body>
    <!--
      THESIS: 把分散的业务工具组织成一张可执行的日常运营清单，而不是一面装饰性仪表盘。
      OWN-WORLD: 轻量化的运营调度台，像一张清晰的值班台账：工作优先级、责任人、模块状态在同一视野内。
      STORY: 用户先处理待办，再进入部门应用；应用的真实数据仍由各自系统负责。
      FIRST VIEWPORT: 待办与待审批优先，随后是三个已接入系统的运行状态。
      FORM: 固定侧栏、序号式清单、细线分隔、靛蓝操作信号和琥珀风险标记。
      FINISH: 未完成实际权限接入、网关部署和视觉复核前，不可作为生产环境使用。
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
